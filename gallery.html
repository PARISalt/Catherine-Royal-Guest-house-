    <style>
        body { background-color: #0A0A0A; color: #FAFAFA; }
        
        /* Masonry Grid Setup */
        .masonry {
            column-count: 1;
            column-gap: 1rem;
        }
        @media (min-width: 640px) { .masonry { column-count: 2; } }
        @media (min-width: 1024px) { .masonry { column-count: 3; } }
        @media (min-width: 1280px) { .masonry { column-count: 4; } }
        
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 1rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border-radius: 0.25rem;
        }
        
        .masonry-item img {
            width: 100%;
            display: block;
            transition: transform 0.5s ease;
        }
        
        .masonry-item:hover img {
            transform: scale(1.05);
        }

        .masonry-item::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(10,10,10,0.7) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .masonry-item:hover::after {
            opacity: 1;
        }

        /* Lightbox Styles */
        #lightbox {
            display: none;
            position: fixed;
            z-index: 100;
            inset: 0;
            background-color: rgba(10, 10, 10, 0.95);
            padding: 2rem;
            align-items: center;
            justify-content: center;
        }
        #lightbox.active {
            display: flex;
        }
        #lightbox img {
            max-height: 90vh;
            max-width: 90vw;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
            border: 2px solid #D4AF37;
        }
    </style>

    <div id="lightbox" class="fixed inset-0 z-[100] bg-black bg-opacity-95 hidden flex-col items-center justify-center p-4" onclick="closeLightbox(event)">
        <span class="absolute top-6 right-8 text-white text-4xl cursor-pointer hover:text-gold transition-colors z-50" onclick="closeLightbox(event)">&times;</span>
        
        <button onclick="changeGallerySlide(-1, event)" class="absolute left-4 md:left-10 text-white hover:text-gold text-4xl md:text-6xl p-4 z-50 focus:outline-none">&#10094;</button>
        
        <img id="lightbox-img" src="" alt="Full screen image" class="max-h-[85vh] max-w-[85vw] object-contain shadow-[0_0_30px_rgba(212,175,55,0.2)] border border-gold transition-opacity duration-300">
        
        <button onclick="changeGallerySlide(1, event)" class="absolute right-4 md:right-10 text-white hover:text-gold text-4xl md:text-6xl p-4 z-50 focus:outline-none">&#10095;</button>
        
        <p id="lightbox-counter" class="absolute bottom-6 text-gold font-sans text-sm tracking-widest"></p>
    </div>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const counter = document.getElementById('lightbox-counter');
        let currentIdx = 0;
        let galleryImages = [];

        // Auto-detect all your 40 uploaded photos
        window.addEventListener('DOMContentLoaded', () => {
            const images = document.querySelectorAll('.masonry-item img');
            images.forEach((img, index) => {
                galleryImages.push(img.src); // Add to slider array
                // Update the click action
                img.parentElement.onclick = (e) => {
                    e.preventDefault();
                    openLightbox(index);
                };
            });
        });

        function openLightbox(index) {
            currentIdx = index;
            updateLightboxImage();
            lightbox.classList.remove('hidden');
            lightbox.classList.add('flex');
            document.body.style.overflow = 'hidden'; // Stop background scrolling
        }

        function closeLightbox(event) {
            // Close only if clicking the background or the X
            if (event.target === lightbox || event.target.tagName === 'SPAN') {
                lightbox.classList.add('hidden');
                lightbox.classList.remove('flex');
                document.body.style.overflow = 'auto'; // Restore scrolling
            }
        }

        function changeGallerySlide(direction, event) {
            if (event) event.stopPropagation(); // Don't close the modal when clicking arrows
            
            currentIdx += direction;
            // Loop around if they hit the end
            if (currentIdx >= galleryImages.length) currentIdx = 0;
            if (currentIdx < 0) currentIdx = galleryImages.length - 1;
            
            // Tiny fade effect between images
            lightboxImg.style.opacity = 0;
            setTimeout(() => {
                updateLightboxImage();
                lightboxImg.style.opacity = 1;
            }, 150);
        }

        function updateLightboxImage() {
            lightboxImg.src = galleryImages[currentIdx];
            counter.innerText = (currentIdx + 1) + " / " + galleryImages.length;
        }
    </script>
