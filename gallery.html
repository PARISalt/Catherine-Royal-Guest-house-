<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Catherine Royale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { DEFAULT: '#D4AF37', light: '#F3E5AB', dark: '#AA8C2C' },
                        black: { DEFAULT: '#0A0A0A', rich: '#111111' },
                        white: { DEFAULT: '#FAFAFA' }
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0A0A0A; color: #FAFAFA; }
        
        /* Masonry Grid Setup */
        .masonry {
            column-count: 1;
            column-gap: 1rem;
        }
        @media (min-width: 640px) { .masonry { column-count: 2; } }
        @media (min-width: 1024px) { .masonry { column-count: 3; } }
        @media (min-width: 1280px) { .masonry { column-count: 4; } }
        
        .masonry-item {
            break-inside: avoid;
            margin-bottom: 1rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border-radius: 0.25rem;
        }
        
        .masonry-item img {
            width: 100%;
            display: block;
            transition: transform 0.5s ease;
        }
        
        .masonry-item:hover img {
            transform: scale(1.05);
        }

        .masonry-item::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(10,10,10,0.7) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .masonry-item:hover::after {
            opacity: 1;
        }

        /* Lightbox Styles */
        #lightbox {
            display: none;
            position: fixed;
            z-index: 100;
            inset: 0;
            background-color: rgba(10, 10, 10, 0.95);
            padding: 2rem;
            align-items: center;
            justify-content: center;
        }
        #lightbox.active {
            display: flex;
        }
        #lightbox img {
            max-height: 90vh;
            max-width: 90vw;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
            border: 2px solid #D4AF37;
        }
    </style>
</head>
<body class="font-sans antialiased">

    <nav class="fixed w-full z-50 bg-black bg-opacity-95 shadow-md border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-serif text-gold font-semibold tracking-wider">
                CATHERINE ROYALE
            </a>
            <div class="hidden md:flex space-x-8 text-sm uppercase tracking-widest text-white">
                <a href="index.html" class="hover:text-gold transition-colors">Home</a>
                <a href="rooms.html" class="hover:text-gold transition-colors">Rooms & Suites</a>
                <a href="events.html" class="hover:text-gold transition-colors">Events</a>
                <a href="gallery.html" class="text-gold transition-colors">Gallery</a>
            </div>
            <a href="rooms.html" class="hidden md:block bg-gold text-black hover:bg-white hover:shadow-[0_0_15px_rgba(212,175,55,0.5)] transition-all duration-300 px-6 py-2 uppercase text-xs font-semibold tracking-widest">
                Reserve Now
            </a>
        </div>
    </nav>

    <header class="pt-32 pb-16 px-6 text-center">
        <h1 class="text-4xl md:text-6xl font-serif text-white mb-4">Our Gallery</h1>
        <div class="w-24 h-1 bg-gold mx-auto mb-6"></div>
        <p class="text-gray-400 max-w-2xl mx-auto text-lg font-light">Explore the elegant spaces, luxurious suites, and premium amenities that define the Catherine Royale experience.</p>
    </header>

    <section class="px-6 pb-24 max-w-screen-2xl mx-auto">
        <div class="masonry" id="gallery-container">
            <div class="masonry-item" onclick="openLightbox(this)">
                <img src="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?q=80&w=2000&auto=format&fit=crop" loading="lazy" alt="Luxury Room">
            </div>
            <div class="masonry-item" onclick="openLightbox(this)">
                <img src="https://images.unsplash.com/photo-1582719478250-c89404bb8a0e?q=80&w=2000&auto=format&fit=crop" loading="lazy" alt="Hotel Lobby">
            </div>
            <div class="masonry-item" onclick="openLightbox(this)">
                <img src="https://images.unsplash.com/photo-1566665797739-1674de7a421a?q=80&w=2000&auto=format&fit=crop" loading="lazy" alt="Bedroom">
            </div>
             <div class="masonry-item" onclick="openLightbox(this)">
                <img src="https://images.unsplash.com/photo-1542314831-c6a4d14d8373?q=80&w=2000&auto=format&fit=crop" loading="lazy" alt="Exterior View">
            </div>
            <div class="masonry-item" onclick="openLightbox(this)">
                <img src="https://images.unsplash.com/photo-1578683010236-d716f9a3f461?q=80&w=2000&auto=format&fit=crop" loading="lazy" alt="Bathroom Luxury">
            </div>
            <div class="masonry-item" onclick="openLightbox(this)">
                <img src="https://images.unsplash.com/photo-1519710164239-da123dc03ef4?q=80&w=2000&auto=format&fit=crop" loading="lazy" alt="Lounge Area">
            </div>
        </div>
    </section>

    <div id="lightbox" onclick="closeLightbox(event)">
        <span class="absolute top-6 right-8 text-white text-4xl cursor-pointer hover:text-gold transition-colors">&times;</span>
        <img id="lightbox-img" src="" alt="Full screen image">
    </div>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        function openLightbox(element) {
            const imgSrc = element.querySelector('img').src;
            lightboxImg.src = imgSrc;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden'; // Prevent scrolling when open
        }

        function closeLightbox(event) {
            // Close if clicking anywhere except the image itself
            if (event.target !== lightboxImg) {
                lightbox.classList.remove('active');
                document.body.style.overflow = 'auto'; // Restore scrolling
            }
        }
    </script>
</body>
                  </html>
